<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ziko Gold Trading</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b0b0f; color: #f2ede0; font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", Tahoma, sans-serif; }
  a { color: inherit; }
  #splash { position: fixed; inset: 0; background: #0b0b0f; display: flex; align-items: center; justify-content: center; z-index: 100; transition: opacity .55s ease; }
  #splash.hide { opacity: 0; pointer-events: none; }
  #splash img { width: 330px; height: 330px; object-fit: cover; border-radius: 28px; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 18px 16px 40px; }
  header { display: flex; align-items: center; gap: 12px; }
  header .logo { width: 100px; height: 100px; border-radius: 18px; object-fit: cover; flex: none; }
  header h1 { font-family: Georgia, "Times New Roman", serif; color: #e8c15a; font-size: 30px; margin: 0; line-height: 1.2; }
  header .sub { color: #b8b0a0; font-size: 15px; margin-top: 4px; }
  header > div { flex: 1; min-width: 0; }
  #langBtn { margin-inline-start: auto; background: #1c1c22; color: #e8c15a; border: 1px solid #3a3a44; border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 700; cursor: pointer; flex: none; }
  .pills { display: flex; gap: 10px; margin: 18px 0 14px; }
  .pill { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; background: #17171d; border: 1px solid #2c2c34; border-radius: 999px; padding: 10px 8px; font-size: 15px; font-weight: 700; cursor: pointer; color: #f2ede0; }
  .pill .dot { width: 9px; height: 9px; border-radius: 50%; background: #2fbf71; display: inline-block; }
  .pill .dot.closed { background: #e05252; }
  .top-alert-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin: 16px 0 0; background: linear-gradient(180deg, #e8c15a, #c9a13b); color: #1a1405; border: none; border-radius: 14px; padding: 14px 16px; font-size: 17px; font-weight: 800; font-family: inherit; cursor: pointer; }
  .top-alert-btn.on { background: #123d24; color: #5eead4; cursor: default; }
  .top-alert-btn.denied { background: #17171d; border: 1px solid #2c2c34; color: #8d8778; cursor: default; font-size: 14px; font-weight: 700; line-height: 1.6; }
  #staleBanner { display: none; background: #3a1d1d; border: 1px solid #6b2f2f; color: #f3b8b8; border-radius: 12px; padding: 12px 14px; font-size: 14px; line-height: 1.6; margin-bottom: 14px; }
  #staleBanner.updating { background: #221d12; border: 1px solid #5a4d24; color: #d8c98a; }
  .prices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
  .price-card { background: #17171d; border: 1px solid #2c2c34; border-radius: 16px; padding: 16px 14px; }
  .price-card .name { font-size: 17px; font-weight: 700; }
  .price-card .sym { color: #8d8778; font-size: 13px; margin-inline-start: 6px; }
  .price-card .val { font-size: 30px; font-weight: 800; margin: 10px 0 6px; direction: ltr; text-align: end; }
  .price-card .val small { font-size: 16px; color: #b8b0a0; }
  .price-card .note { color: #8d8778; font-size: 12.5px; line-height: 1.5; }
  .sum-card { background: #17171d; border: 1px solid #2c2c34; border-radius: 16px; padding: 16px 14px; margin-bottom: 12px; }
  .sum-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .sum-head .name { font-size: 18px; font-weight: 800; }
  .sum-head .sym { color: #8d8778; font-size: 13px; margin-inline-start: 6px; font-weight: 400; }
  .sum-price { font-size: 26px; font-weight: 800; direction: ltr; white-space: nowrap; }
  .sum-price small { font-size: 14px; color: #b8b0a0; }
  .sum-card .nums { margin-top: 12px; }
  .sum-card .note { color: #8d8778; font-size: 12.5px; line-height: 1.5; margin-top: 10px; }
  .chg.up { color: #5eead4; }
  .chg.down { color: #ff7a7a; }
  .sum-line { background: #17171d; border: 1px solid #2c2c34; border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; font-size: 15px; font-weight: 700; line-height: 1.6; }
  .sum-news-label { color: #8d8778; font-size: 13px; margin: 4px 0 8px; }
  h2 { font-size: 20px; margin: 22px 0 4px; }
  .updated { color: #8d8778; font-size: 13px; margin-bottom: 12px; }
  .sig-card { background: #17171d; border: 1px solid #2c2c34; border-radius: 16px; padding: 16px 14px; margin-bottom: 12px; }
  .sig-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .sig-head .name { font-size: 18px; font-weight: 800; }
  .badge { border-radius: 999px; padding: 5px 12px; font-size: 14px; font-weight: 800; }
  .state-ico { font-size: 28px; line-height: 1; margin-inline-start: 8px; }
  .badge.wait { background: #4a3d10; color: #ffd75e; }
  .badge.buy { background: #123d24; color: #5eead4; }
  .badge.sell { background: #4a1717; color: #ff7a7a; }
  .bias { color: #b8b0a0; font-size: 14px; margin: 8px 0 12px; }
  .nums { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
  .nums .cell { background: #101014; border-radius: 10px; padding: 9px 11px; }
  .nums .lbl { color: #8d8778; font-size: 12.5px; }
  .nums .v { font-size: 18px; font-weight: 800; direction: ltr; text-align: end; }
  .cond { color: #cbb96a; font-size: 13.5px; line-height: 1.6; margin-top: 10px; }
  .last-posted { border-top: 1px solid #2c2c34; margin-top: 12px; padding-top: 10px; font-size: 13.5px; color: #b8b0a0; line-height: 1.8; }
  .last-posted b { color: #f2ede0; }
  .news-item { background: #17171d; border: 1px solid #2c2c34; border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; font-size: 14.5px; line-height: 1.6; }
  .hist-item { background: #17171d; border: 1px solid #2c2c34; border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; font-size: 14px; line-height: 1.7; }
  .hist-item .h-head { display: flex; justify-content: space-between; gap: 6px 10px; flex-wrap: wrap; font-weight: 800; }
  .hist-item .h-kind { color: #8d8778; font-size: 12.5px; font-weight: 400; }
  .hist-item .h-nums { color: #b8b0a0; }
  .hist-item .h-nums b { color: #f2ede0; }
  .hist-item .h-res { margin-top: 4px; font-weight: 800; }
  .hist-item .h-res.tp1, .hist-item .h-res.both { color: #5eead4; }
  .hist-item .h-res.open { color: #ffd75e; }
  .hist-item .h-res.sl { color: #ff7a7a; }
  .news-item .t { color: #8d8778; font-size: 12.5px; }
  .alerts-box { background: #17171d; border: 1px solid #2c2c34; border-radius: 16px; padding: 16px 14px; }
  .alerts-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .switch { position: relative; width: 52px; height: 30px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: #3a3a44; border-radius: 999px; cursor: pointer; transition: .2s; }
  .slider:before { content: ""; position: absolute; width: 24px; height: 24px; border-radius: 50%; background: #fff; top: 3px; inset-inline-start: 3px; transition: .2s; }
  .switch input:checked + .slider { background: #b8860b; }
  .switch input:checked + .slider:before { transform: translateX(-22px); }
  html[dir="ltr"] .switch input:checked + .slider:before { transform: translateX(22px); }
  #alertsList { list-style: none; margin: 12px 0 0; padding: 0; }
  #alertsList li { background: #101014; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; font-size: 14px; line-height: 1.6; }
  .muted { color: #8d8778; font-size: 13.5px; line-height: 1.6; }
  .sub-btns { display: grid; gap: 10px; }
  .sub-btn { display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; padding: 13px; font-size: 16px; font-weight: 800; text-decoration: none; }
  .sub-btn.tg { background: #229ed9; color: #fff; }
  .sub-btn.fb { background: #1877f2; color: #fff; }
  footer { text-align: center; color: #8d8778; font-size: 12.5px; line-height: 1.7; margin-top: 26px; }
  .empty { color: #8d8778; font-size: 14px; text-align: center; padding: 8px 0; }
</style>
</head>

  if (!news.length) { box.innerHTML = '<div class="empty">' + esc(t("noNews")) + "</div>"; return; }
  box.innerHTML = news.map(function (n) {
    return "<div class=\"news-item\"><div>" + esc(n.text) + "</div><div class=\"t\">" + esc(fmtTime(n.time)) + "</div></div>";

}

function renderHistory() {

      esc(t("tp1")) + " <b>" + esc(e.tp1) + "</b> · " + esc(t("tp2")) + " <b>" + esc(e.tp2) + "</b></div>" + res + "</div>";

function cairoDay(iso) {
  try {
    return new Intl.DateTimeFormat("en-CA", { timeZone: "Africa/Cairo", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date(iso));
  } catch (e) { return ""; }
}
function renderSummary() {
  const box = document.getElementById("summaryBox");
  if (!box) return;
  const spot = (currentFeed && currentFeed.spot) || {};
  let html = "";
  [["gold", t("gold"), "XAU/USD"], ["silver", t("silver"), "XAG/USD"]].forEach(function (row) {
    const key = row[0], name = row[1], sym = row[2];
    const st = dayStats[key];
    const chg = st && typeof st.change === "number" ? st.change : null;
    const chgCls = chg === null ? "" : (chg >= 0 ? " up" : " down");
    const chgTxt = chg === null ? "—" : (chg >= 0 ? "+" : "") + chg.toFixed(2) + "%";
    const cell = function (lbl, v) { return "<div class=\"cell\"><div class=\"lbl\">" + esc(lbl) + "</div><div class=\"v\">" + esc(v) + "</div></div>"; };
    html += "<div class=\"sum-card\"><div class=\"sum-head\"><span class=\"name\">" + esc(name) +
      " <span class=\"sym\">" + sym + "</span></span>" +
      "<span class=\"sum-price\"><small>$</small> " + esc(fmtPrice(spot[key])) + "</span></div>" +
      "<div class=\"nums\">" +
      cell(t("dayOpen"), st ? fmtPrice(st.open) : "—") +
      cell(t("dayHigh"), st ? fmtPrice(st.high) : "—") +
      cell(t("dayLow"), st ? fmtPrice(st.low) : "—") +
      "<div class=\"cell\"><div class=\"lbl\">" + esc(t("dayChange")) + "</div><div class=\"v chg" + chgCls + "\">" + esc(chgTxt) + "</div></div>" +
      "</div><div class=\"note\">" + esc(priceNote(key)) + "</div></div>";
  });
  // Today's signals — posted history only (single source of truth: never
  // recomputed unposted analysis).
  const today = cairoDay(new Date().toISOString());
  const hist = (currentFeed && currentFeed.history) || [];
  const todays = hist.filter(function (e) { return cairoDay(e.posted_at) === today; });
  if (!todays.length) {
    html += "<div class=\"sum-line\">" + esc(t("noSignalsToday")) + "</div>";
  } else {
    const hits = todays.filter(function (e) { return e.result === "tp1" || e.result === "both"; }).length;
    html += "<div class=\"sum-line\">" + esc(todays.length + " " + t("signalsToday") + " — " + hits + " " + t("hitTargets")) + "</div>";
  }
  // Top 2 news — channel-posted news only (same data as the news section).
  const news = (currentFeed && currentFeed.news) || [];
  html += "<div class=\"sum-news-label\">" + esc(t("summaryNews")) + "</div>";
  if (!news.length) {
    html += "<div class=\"empty\">" + esc(t("noNews")) + "</div>";
  } else {
    html += news.slice(0, 2).map(function (n) {
      return "<div class=\"news-item\"><div>" + esc(n.text) + "</div><div class=\"t\">" + esc(fmtTime(n.time)) + "</div></div>";
    }).join("");
  }
  box.innerHTML = html;
}
function renderAll() {
  renderPrices();
  renderSummary();
  renderSignals();
  renderHistory();
  renderNews();
}

function updateMarketPill() {
  try {
    const now = new Date();
    const parts = new Intl.DateTimeFormat("en-US", { timeZone: "Africa/Cairo", weekday: "short", hour: "numeric", hour12: false }).formatToParts(now);
    let wd = "", h = 0;
    parts.forEach(function (p) { if (p.type === "weekday") wd = p.value; if (p.type === "hour") h = parseInt(p.value, 10) % 24; });
    const open = ["Mon", "Tue", "Wed", "Thu", "Fri"].indexOf(wd) >= 0 && h >= 1;
    document.getElementById("marketPill").textContent = open ? t("marketOpen") : t("marketClosed");
    document.getElementById("marketDot").className = "dot" + (open ? "" : " closed");
  } catch (e) {}
}

function fetchWithTimeout(url, ms) {
  const ctrl = new AbortController();
  const timer = setTimeout(function () { ctrl.abort(); }, ms || 12000);
  return fetch(url, { signal: ctrl.signal, cache: "no-store" })
    .then(function (r) { clearTimeout(timer); if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .catch(function (e) { clearTimeout(timer); throw e; });
}
// Stability: fetch ALL feed channels and use the NEWEST payload by
// updated_at. The old first-success-wins race could show a stale cached
// copy (jsDelivr caches GitHub files) and flip the data on every reload.
function fetchNewestFeed(urls) {
  return Promise.all(urls.map(function (u) {
    return fetchWithTimeout(u, 12000).catch(function () { return null; });
  })).then(function (results) {
    let best = null, bestMs = 0;
    results.forEach(function (data) {
      if (!data || !data.gold || !data.silver) return;
      const ms = feedTimeMs(data);
      if (ms > bestMs) { bestMs = ms; best = data; }
    });
    if (!best) throw new Error("bad feed");
    return best;
  });
}

function checkNewSignals(feed) {
  ["gold", "silver"].forEach(function (key) {
    const d = feed[key];
    if (!d) return;
    const sig = String(d.signal || "").toUpperCase();
    if (sig.indexOf("BUY") !== 0 && sig.indexOf("SELL") !== 0) return;
    const stamp = sig + "@" + d.entry;
    if (lastSeenSignals[key] === stamp) return;
    lastSeenSignals[key] = stamp;
    try { localStorage.setItem("zgt-last-seen", JSON.stringify(lastSeenSignals)); } catch (e) {}
    addAlert(key, d);
  });
}
function addAlert(key, d) {
  const name = key === "gold" ? t("gold") : t("silver");
  const text = t("newSignal") + ": " + name + " — " + signalLabel(d.signal) + " " + d.entry;
  const li = document.createElement("li");
  li.textContent = text + " (" + fmtTime(new Date().toISOString()) + ")";
  const list = document.getElementById("alertsList");
  list.insertBefore(li, list.firstChild);
  while (list.children.length > 20) list.removeChild(list.lastChild);
  document.getElementById("alertsEmpty").style.display = "none";
  if (typeof Notification !== "undefined" && Notification.permission === "granted") {
    try { new Notification("Ziko Gold Trading", { body: text }); } catch (e) {}
  }
}

function refreshFeed() {
  if (feedInFlight) return Promise.resolve(false);
  feedInFlight = true;
  const sources = [
    "./signals.json",
    "https://raw.githubusercontent.com/designsarchitech/ziko-gold-trading-data/main/signals.json",
    "https://cdn.jsdelivr.net/gh/designsarchitech/ziko-gold-trading-data@main/signals.json"
  ];
  return fetchNewestFeed(sources).then(function (data) {
    feedInFlight = false;
    // Monotonic guard: never replace the displayed feed with older data.
    // A live fetch that returns only older data still proves connectivity,
    // so it counts as a live contact (no error banner) without swapping data.
    if (feedTimeMs(data) < feedTimeMs(currentFeed)) { noteLiveSuccess(); renderAll(); return false; }
    currentFeed = data;
    livePriceAt = { gold: null, silver: null };
    noteLiveSuccess();
    checkNewSignals(data);
    renderAll();
    return true;
  }).catch(function () {
    feedInFlight = false;
    onFeedFailure();
    renderAll();
    return false;
  });
}
// Stability: prices use SEQUENTIAL fallback only — gold-api first, then
// TradingView, then CORS proxies, then the feed spot (refreshPrices keeps the
// feed spot when this returns null). The old race between gold-api and
// TradingView made the price jump between spot and the OANDA close (dollars
// apart) on every refresh.
function priceFromPayload(d) {
  if (!d) return null;
  if (typeof d.price === "number") return d.price;
  if (typeof d.close === "number") return d.close;
  // allorigins wraps the upstream JSON as a string in .contents
  if (typeof d.contents === "string") {
    try { return priceFromPayload(JSON.parse(d.contents)); } catch (e) { return null; }
  }
  return null;
}
function tryPrice(url) {
  return fetchWithTimeout(url, 12000).then(priceFromPayload).catch(function () { return null; });
}
function livePrice(metal) {
  const sym = metal === "gold" ? "XAU" : "XAG";
  const goldApi = "https://api.gold-api.com/price/" + sym;
  const tv = metal === "gold"
    ? "https://scanner.tradingview.com/symbol?symbol=OANDA:XAUUSD&fields=close"
    : "https://scanner.tradingview.com/symbol?symbol=TVC:SILVER&fields=close";
  const proxies = [
    "https://api.allorigins.win/get?url=" + encodeURIComponent(goldApi),
    "https://corsproxy.io/?url=" + encodeURIComponent(goldApi),
    "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(goldApi)
  ];
  return tryPrice(goldApi).then(function (p) {
    if (p) return p;
    return tryPrice(tv);
  }).then(function (p) {
    if (p) return p;
    // CORS proxies, one after another.
    let chain = Promise.resolve(null);
    proxies.forEach(function (u) {
      chain = chain.then(function (prev) { return prev || tryPrice(u); });
    });
    return chain;
  }).catch(function () { return null; });
}
function fetchDayStats(metal) {
  const url = metal === "gold"
    ? "https://scanner.tradingview.com/symbol?symbol=OANDA:XAUUSD&fields=open,high,low,close,change,change_abs"
    : "https://scanner.tradingview.com/symbol?symbol=TVC:SILVER&fields=open,high,low,close,change,change_abs";
  return fetchWithTimeout(url, 12000).then(function (d) {
    if (!d || typeof d.open !== "number" || typeof d.high !== "number" || typeof d.low !== "number") return null;
    return { open: d.open, high: d.high, low: d.low, change: (typeof d.change === "number" ? d.change : null) };
  }).catch(function () { return null; });
}
function refreshPrices() {
  Promise.all([fetchDayStats("gold"), fetchDayStats("silver")]).then(function (st) {
    if (st[0]) dayStats.gold = st[0];
    if (st[1]) dayStats.silver = st[1];
    renderSummary();
  });
  return Promise.all([livePrice("gold"), livePrice("silver")]).then(function (res) {
    const now = new Date().toISOString();
    if (res[0]) {
      if (!currentFeed.spot) currentFeed.spot = {};
      currentFeed.spot.gold = res[0];
      livePriceAt.gold = now;
    } else {
      livePriceAt.gold = null;
    }
    if (res[1]) {
      if (!currentFeed.spot) currentFeed.spot = {};
      currentFeed.spot.silver = res[1];
      livePriceAt.silver = now;
    } else {
      livePriceAt.silver = null;
    }
    renderPrices();
    renderSummary();
  });
}
function refreshAll() {
  refreshFeed();
  refreshPrices();
  updateMarketPill();
}

function setAlertsEnabled(on) {

  alertsToggle.checked = on;
  try { localStorage.setItem("zgt-alerts", on ? "1" : "0"); } catch (e) {}
  syncAlertsUI();
  syncTopAlertsUI();
  if (on && typeof Notification !== "undefined" && Notification.permission === "default") {
    Notification.requestPermission().then(function (p) {
      document.getElementById("alertsDenied").style.display = p === "denied" ? "block" : "none";
      if (p === "granted") { try { initWebPush(); } catch (e) {} }
      syncTopAlertsUI();
    });
  }
  if (on) { try { initWebPush(); } catch (e) {} }
  if (on && typeof Notification !== "undefined" && Notification.permission === "denied") {
    document.getElementById("alertsDenied").style.display = "block";
  }
}

// subscription — the user must tap Allow on the system dialog once. The
// closest to "on by default" is asking automatically, once, right after the
// splash fades. Never re-asks (flag in localStorage); the top button stays as

(function autoPromptAlertsOnce() {
  try {
    if (window.Capacitor) return;
    if (typeof Notification === "undefined") return;
    if (Notification.permission !== "default") return;
    if (alertsEnabled) return;

    setTimeout(function () {
      try {
        if (typeof Notification === "undefined") return;

        if (alertsEnabled) return;
        try { localStorage.setItem("zgt-autoprompt", "1"); } catch (e) {}
